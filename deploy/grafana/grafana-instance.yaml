apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana-instance
  namespace: monitoring
  labels:
    dashboards: "grafana"
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  config:
    log:
      mode: "console"
    security:
      admin_user: admin
      admin_password: prom-operator
  ingress:
    enabled: true
    ingressClassName: external-ingress
    hostname: grafana.srzlab.tech
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-srzlab-tech
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.srzlab.tech
  deployment:
    spec:
      template:
        spec:
          containers:
            - name: grafana
              image: grafana/grafana:13.1.0
