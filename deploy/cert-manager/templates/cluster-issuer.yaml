apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-srzlab-tech
  annotations:
    argocd.argoproj.io/sync-wave: "1" # Deploy in wave 1 after cert-manager pods/CRDs (wave 0) are healthy
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: zshaldy@gmail.com
    privateKeySecretRef:
      name: letsencrypt-srzlab-tech-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: external-ingress
