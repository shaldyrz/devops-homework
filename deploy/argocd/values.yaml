# Helm values configuration for ArgoCD (argo-cd chart)

global:
  image:
    tag: "v2.10.4" # Pin the ArgoCD image version

server:
  extraArgs:
    - --insecure # Disable HTTPS for local development loop behind ingress
  
  service:
    type: NodePort
    nodePortHttp: 30080 # Expose on a fixed port if needed without ingress

configs:
  params:
    server.insecure: "true"
